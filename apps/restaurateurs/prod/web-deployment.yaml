apiVersion: apps/v1
kind: Deployment
metadata:
  name: restaurateurs-web
  namespace: prod
spec:
  replicas: 1
  selector:
    matchLabels:
      app: restaurateurs-web
  template:
    metadata:
      labels:
        app: restaurateurs-web
    spec:
      containers:
        # Nom visé par « kubectl set image » dans le workflow du front.
        - name: web
          image: julienprr/restaurateurs-web:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /index.html
              port: 80
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /index.html
              port: 80
            periodSeconds: 20
          resources:
            requests:
              memory: 32Mi
              cpu: 10m
            limits:
              memory: 128Mi
