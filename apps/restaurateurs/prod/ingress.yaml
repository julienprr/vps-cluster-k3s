apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: restaurateurs
  namespace: prod
  annotations:
    # --- INDISPENSABLE AU TEMPS RÉEL, ne pas retirer ---
    # Par défaut nginx accumule la réponse avant de la transmettre. Sur un flux
    # SSE qui ne se termine jamais, cela veut dire qu'aucun événement n'arrive :
    # les votes des autres membres resteraient invisibles, sans erreur.
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    # Une connexion SSE reste ouverte longtemps sans échange visible. Sans ces
    # délais allongés, nginx la couperait au bout d'une minute.
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /
    cert-manager.io/cluster-issuer: letsencrypt-production
    nginx.ingress.kubernetes.io/configuration-snippet: |
      add_header X-Frame-Options "DENY" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
      add_header Referrer-Policy "no-referrer" always;
      add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
      add_header Content-Security-Policy "default-src 'self'; connect-src 'self' https://play-manager-api.julienprr.com;";
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - restaurateurs.julienprr.com
        - www.restaurateurs.julienprr.com
      secretName: restaurateurs-tls
  rules:
    - host: restaurateurs.julienprr.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: restaurateurs-api
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: restaurateurs-web
                port:
                  number: 80
