# Un seul Ingress pour les deux composants : ils partagent le même domaine.
# Le front répond sur /, l'API sur /api. nginx choisit le chemin le plus
# précis, /api l'emporte donc sur /.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: restaurateurs
  namespace: prod
  annotations:
    # --- INDISPENSABLE AU TEMPS RÉEL, ne pas retirer ---
    # Sans cela nginx accumule la réponse avant de la transmettre, et aucun
    # événement SSE n'arrive : les votes des autres membres resteraient
    # invisibles, sans la moindre erreur.
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    # Une connexion SSE reste ouverte longtemps sans échange visible. Sans ces
    # délais allongés, nginx la couperait au bout d'une minute.
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"

    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"

    # Volontairement ABSENTES, ne pas les réintroduire depuis une autre app :
    #  - rewrite-target : réécrirait /api/auth/me en /, l'API ne recevrait
    #    jamais les bons chemins et plus rien ne fonctionnerait.
    #  - configuration-snippet : refusée par le contrôleur, les snippets sont
    #    désactivés depuis plusieurs failles. Les en-têtes de sécurité se
    #    posent dans le nginx du conteneur web.
    #  - cert-manager.io/cluster-issuer : le certificat est décrit
    #    explicitement dans certificate.yaml.
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - restaurateurs.julienprr.com
      secretName: restaurateurs-tls
  rules:
    - host: restaurateurs.julienprr.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: restaurateurs-api
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: restaurateurs-web
                port:
                  number: 80
