apiVersion: apps/v1
kind: Deployment
metadata:
  name: restaurateurs-api
  namespace: prod
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: restaurateurs-api
  template:
    metadata:
      labels:
        app: restaurateurs-api
    spec:
      containers:
        - name: api
          image: julienprr/restaurateurs-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: restaurateurs-config
            - secretRef:
                name: restaurateurs-secrets
          startupProbe:
            httpGet:
              path: /api/health
              port: 8080
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8080
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8080
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              memory: 384Mi
              cpu: 100m
            limits:
              memory: 768Mi
