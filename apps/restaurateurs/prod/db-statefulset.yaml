apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: restaurateurs-db
  namespace: prod
spec:
  serviceName: restaurateurs-db
  replicas: 1
  selector:
    matchLabels:
      app: restaurateurs-db
  template:
    metadata:
      labels:
        app: restaurateurs-db
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: restaurateurs
            # Mêmes identifiants que ceux lus par l'API : une seule source de
            # vérité, dans le SealedSecret.
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: restaurateurs-secrets
                  key: DB_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: restaurateurs-secrets
                  key: DB_PASSWORD
            # Les données vivent dans un sous-dossier : le point de montage
            # lui-même n'est pas vide, ce que Postgres refuserait.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["sh", "-c", 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"']
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["sh", "-c", 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"']
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              memory: 128Mi
              cpu: 50m
            limits:
              memory: 512Mi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
